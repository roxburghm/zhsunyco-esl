[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zhsunyco-esl"
version = "0.1.0"
description = "Python library for Zhsunyco BLE e-ink labels"
authors = [
  { name="User", email="user@example.com" },
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "bleak",
    "Pillow",
    "click",
    "python-barcode",
    "requests"
]

[project.urls]
"Homepage" = "https://github.com/username/zhsunyco"
"Bug Tracker" = "https://github.com/username/zhsunyco/issues"

[tool.setuptools.packages.find]
where = ["src"]
